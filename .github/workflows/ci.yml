name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install build
      - name: Tests
        run: python -m pytest
      - name: Compile
        run: python -m compileall inspection src scripts tests
      - name: Build wheel
        run: python -m build --wheel
      - name: Guard raw competition files
        shell: bash
        run: |
          # The two versioned DOCX files under assets/templates are production
          # templates, not raw competition inputs; all other binary artifacts
          # remain forbidden.
          forbidden="$(git ls-files | grep -Ei '\.(doc|docx|pdf|png|jpe?g|zip|tar|gz)$' | grep -Ev '^assets/templates/.*\.docx$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Raw/binary competition artifacts must not be tracked:"
            echo "$forbidden"
            exit 1
          fi
